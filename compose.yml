services:
  postres:
    image: postgres:17-alpine
    container_name: sinergyrp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinergyrp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rfid_traceability}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: